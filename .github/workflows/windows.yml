name: Windows build
on:
  workflow_dispatch:
  push:
    paths: ['Windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build portable x64 app
        shell: pwsh
        run: ./Windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FormatWheel-Windows-x64-preview
          path: Windows/publish/
