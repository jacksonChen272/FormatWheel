name: Windows build
on:
  workflow_dispatch:
  push:
    paths: ['Windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build portable x64 app
        shell: pwsh
        run: ./Windows/build.ps1
      - name: Verify standalone EXE
        shell: pwsh
        run: |
          $env:FORMATWHEEL_DATA = Join-Path $env:RUNNER_TEMP 'FormatWheel-tests'
          $report = Join-Path $env:RUNNER_TEMP 'FormatWheel-results'
          $p = Start-Process ./Windows/release/FormatWheel-Windows-x64.exe -ArgumentList @('--self-test', ('"'+$report+'"')) -Wait -PassThru -WindowStyle Hidden
          Get-Content (Join-Path $report 'report.json')
          if ($p.ExitCode -ne 0) { throw "Self-test exited $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: FormatWheel-Windows-x64
          path: Windows/release/
